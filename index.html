<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jukebox of Names</title>
<meta name="theme-color" content="#c8203a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Name Songs">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Archivo:wght@400;600;700&family=Courier+Prime:wght@400;700&display=swap">
<style>
:root{
  --bg:#e6e9ef; --panel:#f7f8fb; --ink:#1d2433; --muted:#5b6478;
  --strip:#fffdf8; --band:#c8203a; --band2:#1f4fa3; --line:#cdd3de; --hi:#ffe066;
  --display:"Bungee","Arial Black",sans-serif; --body:"Archivo",system-ui,sans-serif; --type:"Courier Prime","Courier New",monospace;
  --tabh:62px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121725; --panel:#1b2234; --ink:#e9ecf3; --muted:#9aa3b8;
  --strip:#232b40; --band:#e2445c; --band2:#5a8de0; --line:#2f3850; --hi:#6b5a12; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.app{max-width:560px;margin:0 auto;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 16px)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));
  border-bottom:1px solid var(--line);display:grid;gap:8px}
h1{font:400 24px/1 var(--display);margin:0;color:var(--band)}
h1 span{color:var(--band2)}
#q{width:100%;font:600 16px var(--body);padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
select{width:100%;min-width:0;font:600 13px var(--body);padding:8px 6px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
main{padding:10px max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));display:grid;gap:8px}
:focus-visible{outline:3px solid var(--band2);outline-offset:2px}
.meta{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.meta b{color:var(--ink)}
.nrow{display:grid;grid-template-columns:1.8em minmax(0,1fr) 72px auto;gap:8px;align-items:center;background:var(--strip);
  border:1px solid var(--line);border-radius:6px;padding:9px 10px;text-align:left;font:inherit;color:inherit;width:100%;cursor:pointer}
.rank{font-family:var(--type);color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.nname{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--band)}
.m .bar i{background:var(--band2)} .u .bar i{background:var(--muted)}
.cnt{font:400 13px var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.strip{background:var(--strip);border:1px solid var(--line);border-radius:3px;font-family:var(--type);display:grid;grid-template-columns:44px minmax(0,1fr)}
.code{font:400 13px var(--display);color:#fff;background:var(--band2);display:grid;place-items:center}
.code.mb{background:var(--muted)}
.sb{padding:8px 10px;min-width:0}
.title{font-weight:700;font-size:15px;color:var(--band);text-transform:uppercase;line-height:1.2;overflow-wrap:anywhere}
.band{height:3px;background:var(--band);margin:6px 0 5px;opacity:.85}
.foot{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.links{display:flex;gap:12px}
.links a{color:var(--band2);font:700 12px var(--body);text-decoration:none;text-transform:uppercase;letter-spacing:.04em;padding:4px 0}
.tag{font:700 10px var(--body);letter-spacing:.08em;text-transform:uppercase;padding:2px 5px;border-radius:4px;color:#fff;margin-left:5px;vertical-align:1px;background:var(--band)}
.tag.m{background:var(--band2)} .tag.u,.tag.l{background:var(--muted)} .tag.mbt{background:transparent;color:var(--muted);border:1px solid var(--line)}
mark{background:var(--hi);color:inherit}
.more{background:var(--panel);border:1px dashed var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;font-size:13px;color:var(--muted)}
.more button{font:700 14px var(--body);padding:11px;border-radius:8px;border:0;background:var(--band2);color:#fff;cursor:pointer}
.gbtn{display:block;text-align:center;font:700 14px var(--body);padding:11px;border-radius:8px;border:1px solid var(--band2);color:var(--band2);text-decoration:none}
.more button:disabled{opacity:.6}
.empty{padding:20px 8px;text-align:center;color:var(--muted)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);
  display:grid;grid-template-columns:1fr 1fr 1fr;padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.tabs button{height:var(--tabh);border:0;background:none;color:var(--muted);font:700 12px var(--body);letter-spacing:.05em;text-transform:uppercase;cursor:pointer;display:grid;place-items:center;gap:0;align-content:center}
.tabs button b{font:400 18px var(--display);display:block}
.tabs button[aria-pressed="true"]{color:var(--band)}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>Jukebox <span>of</span> Names</h1>
    <input id="q" type="search" placeholder="Type a name, e.g. Martin" autocomplete="off" aria-label="Search by name or song title">
    <div class="filters">
      <select id="gender" aria-label="Gender"><option value="all">Everyone</option><option value="f">Women</option><option value="m">Men</option></select>
      <select id="where" aria-label="Where the name appears"><option value="all">Title or lyrics</option><option value="t">In title</option><option value="l">In lyrics</option></select>
      <select id="decade" aria-label="Decade"><option value="all">All years</option><option value="pre">Pre-1960</option><option value="1960">1960s</option><option value="1970">1970s</option><option value="1980">1980s</option><option value="1990">1990s</option><option value="2000">2000s+</option></select>
    </div>
  </div>
  <main id="main"></main>
</div>
<nav class="tabs" aria-label="Views">
  <button type="button" data-v="names" aria-pressed="true"><b>#</b>Names</button>
  <button type="button" data-v="songs" aria-pressed="false"><b>♫</b>Songs</button>
  <button type="button" data-v="random" aria-pressed="false"><b>?</b>Random</button>
</nav>

Frankie|Frankie|Sister Sledge|1985`;
const MALE=new Set("Jude Daniel Joe Johnny Ziggy Ben Billy Vincent Fernando Arnold Jeremy Denis James Jack Michael Alejandro Mickey Bobby Billie Joe Eli Martin Luka Stan Jessie Tommy Eddie Jojo Desmond Tom Romeo Nigel Gary Geno John Alfie Ernie Matthew Heathcliff Julio Al Roland Frankie".split(" ").concat(["Billie Joe"]));
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1).toLowerCase();
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const SONGS=RAW.trim().split("\n").map(l=>{const [name,title,artist,year,w]=l.split("|");return{name,title,artist,year:+year,w:w==="L"?"l":"t",g:MALE.has(name)?"m":"f"}});
const known=new Map(SONGS.map(s=>[s.name.toLowerCase(),s.g]));
// songs found earlier on MusicBrainz are kept on this phone
store.get("mbSongs",[]).forEach(s=>SONGS.push(s));
SONGS.sort((a,b)=>a.name.localeCompare(b.name)||a.year-b.year);
function codes(){const t={};SONGS.forEach(s=>{if(s.mb){s.code="MB";return}const L=s.name[0].toUpperCase();t[L]=(t[L]||0)+1;s.code=L+t[L]})}
codes();

let view="names",pick=null;
const hl=(text,q)=>{if(!q)return esc(text);const i=text.toLowerCase().indexOf(q);return i<0?esc(text):esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+q.length))+"</mark>"+esc(text.slice(i+q.length))};
const gTag=g=>`<span class="tag ${g}">${g==="f"?"F":g==="m"?"M":"?"}</span>`;
function inDecade(y,d){if(d==="all")return true;if(!y)return false;if(d==="pre")return y<1960;d=+d;if(d===2000)return y>=2000;return y>=d&&y<d+10}
function filtered(){
  const q=$("q").value.trim().toLowerCase(),g=$("gender").value,w=$("where").value,d=$("decade").value;
  return SONGS.filter(s=>inDecade(s.year,d)&&(g==="all"||s.g===g)&&(w==="all"||s.w===w)&&(!q||(s.name+" "+s.title).toLowerCase().includes(q)));
}
function strip(s,q){const term=encodeURIComponent(s.title+" "+s.artist);return `<article class="strip">
  <div class="code${s.mb?" mb":""}">${s.code}</div>
  <div class="sb"><div class="title">${hl(s.title,q)}</div><div class="band"></div>
  <div class="foot"><span>${s.year||"?"} · ${hl(s.name,q)}${gTag(s.g)}${s.w==="l"?'<span class="tag l">Lyrics</span>':""}${s.mb?'<span class="tag mbt">MusicBrainz</span>':""}</span>
  <span class="links"><a href="https://www.google.com/search?q=${term}%20site%3Alyrics.com" target="_blank" rel="noopener">Lyrics</a><a href="https://www.youtube.com/results?search_query=${term}" target="_blank" rel="noopener">Listen</a></span></div></div></article>`}

function moreBox(q){
  if(!q||q.length<2)return "";
  return `<div class="more"><button type="button" id="mbgo">Search MusicBrainz for songs titled “${esc(cap(q))}”</button>
  <a class="gbtn" href="https://www.lyrics.com/lyrics/${encodeURIComponent(cap(q))}" target="_blank" rel="noopener">Songs that mention “${esc(cap(q))}” on Lyrics.com ↗</a>
  <a class="gbtn" href="https://www.google.com/search?q=${encodeURIComponent('songs with the name "'+cap(q)+'" in the lyrics')}" target="_blank" rel="noopener">Search Google instead ↗</a>
  <span id="mbmsg">Finds lesser-known songs and B-sides with this name anywhere in the title. Takes a few seconds.</span></div>`;
}
function render(){
  const q=$("q").value.trim().toLowerCase(), list=pick?[pick]:filtered(); let h="";
  if(view==="names"&&!pick){
    const by={};list.forEach(s=>{(by[s.name]=by[s.name]||{name:s.name,g:s.g,n:0}).n++});
    const rows=Object.values(by).sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name)),max=rows[0]?rows[0].n:1;
    const f=rows.filter(r=>r.g==="f").length,m=rows.filter(r=>r.g==="m").length;
    h+=`<div class="meta"><span><b>${rows.length}</b> names · <b>${f}</b> women · <b>${m}</b> men</span><span>Tap a name</span></div>`;
    let rank=0,prev=null;
    h+=rows.map((r,i)=>{if(r.n!==prev){rank=i+1;prev=r.n}return `<button type="button" class="nrow ${r.g}" data-n="${esc(r.name)}">
      <span class="rank">${rank}</span><span class="nname">${hl(r.name,q)}${gTag(r.g)}</span><span class="bar"><i style="width:${r.n/max*100}%"></i></span><span class="cnt">${r.n}</span></button>`}).join("");
  }else{
    h+=`<div class="meta"><span><b>${list.length}</b> ${list.length===1?"song":"songs"}</span>${pick?'<span>Tap Random again for another</span>':""}</div>`;
    h+=list.map(s=>strip(s,q)).join("");
  }
  if(!list.length)h+=`<p class="empty">Nothing in the jukebox for “${esc($("q").value)}” yet.</p>`;
  if(!pick)h+=moreBox(q);
  $("main").innerHTML=h;
  $("main").querySelectorAll(".nrow").forEach(b=>b.onclick=()=>{$("q").value=b.dataset.n;setView("songs");window.scrollTo(0,0)});
  const go=$("mbgo"); if(go)go.onclick=()=>searchMB(cap($("q").value.trim()));
}
function setView(v){view=v;document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v));render()}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  if(b.dataset.v==="random"){const l=filtered().length?filtered():SONGS;pick=l[Math.floor(Math.random()*l.length)];setView("random");return}
  pick=null;setView(b.dataset.v)});
["q","gender","where","decade"].forEach(id=>$(id).addEventListener("input",()=>{pick=null;if(view==="random")view="songs";setView(view)}));

async function searchMB(name){
  const btn=$("mbgo"),msg=$("mbmsg");btn.disabled=true;
  const esc2=name.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const re=new RegExp("(^|[^a-z])"+esc2+"('s)?([^a-z]|$)","i");
  const have=new Set(SONGS.map(s=>(s.title+"|"+s.artist).toLowerCase())), g=known.get(name.toLowerCase())||"u", hits=new Map();
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  try{
    for(let page=0;page<4;page++){
      msg.textContent=`Searching MusicBrainz… (${page+1} of 4)`;
      if(page)await wait(1100); // MusicBrainz allows about one request a second
      const url="https://musicbrainz.org/ws/2/recording?fmt=json&limit=100&offset="+page*100+"&query="+encodeURIComponent(`recording:${name}`);
      const r=await fetch(url,{headers:{Accept:"application/json"}});
      if(r.status===503){await wait(2000);page--;continue}
      if(!r.ok)throw new Error("http");
      const data=await r.json(), recs=data.recordings||[];
      for(const rec of recs){
        const title=(rec.title||"").trim(); if(!re.test(title))continue;
        const artist=(rec["artist-credit"]||[]).map(a=>a.name+(a.joinphrase||"")).join("").trim(); if(!artist)continue;
        const key=(title.replace(/\s*[\(\[].*$/,"")+"|"+artist).toLowerCase();
        const year=+((rec["first-release-date"]||"").slice(0,4))||0;
        const h=hits.get(key);
        if(h){h.n++;if(year&&(!h.year||year<h.year))h.year=year}
        else hits.set(key,{title:title.replace(/\s*[\(\[](live|remix|demo|edit|mix|version|remaster|acoustic|instrumental|single)[^\)\]]*[\)\]]/ig,"").trim(),artist,year,n:1});
      }
      if(recs.length<100||(page+1)*100>=(data.count||0))break;
    }
    // songs recorded or released many times first: a rough guide to how well known they are
    const found=[...hits.values()].filter(h=>!have.has((h.title+"|"+h.artist).toLowerCase()))
      .sort((a,b)=>b.n-a.n).slice(0,80).map(h=>({name,title:h.title,artist:h.artist,year:h.year,w:"t",g,mb:true}));
    found.forEach(s=>SONGS.push(s));
    store.set("mbSongs",SONGS.filter(s=>s.mb));
    SONGS.sort((a,b)=>a.name.localeCompare(b.name)||a.year-b.year);codes();
    setView("songs");
    const m=$("mbmsg"); if(m)m.textContent=found.length?`Added ${found.length} songs from MusicBrainz, kept on this phone.`:"MusicBrainz had nothing new for this name.";
  }catch(e){
    btn.disabled=false;msg.textContent="Couldn't reach MusicBrainz. Check your connection and try again.";
  }
}
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
